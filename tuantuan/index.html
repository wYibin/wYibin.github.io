<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>团团识字字卡</title>
  <style>
    :root {
      --ink: #172326;
      --muted: #65777a;
      --line: #d8e4e1;
      --paper: #fffdf8;
      --green: #2f8f73;
      --green-soft: #e6f4ee;
      --coral: #ef6f61;
      --blue: #5398c3;
      --yellow: #f2bf48;
      --shadow: 0 16px 36px rgba(35, 52, 56, .11);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #f5faf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #f5faf8 0%, #fffdf8 56%, #eef7fb 100%);
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 44px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .note {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      border: 1px solid #bad7cf;
      border-radius: 8px;
      background: var(--green-soft);
      color: #216657;
      padding: 0 12px;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .random-button {
      min-height: 42px;
      border: 1px solid #dca094;
      border-radius: 8px;
      background: var(--coral);
      color: white;
      padding: 0 18px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(239, 111, 97, .22);
    }

    .random-button:focus-visible,
    .card:focus-visible {
      outline: 4px solid rgba(83, 152, 195, .32);
      outline-offset: 3px;
    }

    .deck {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      padding-top: 20px;
    }

    .card {
      min-height: 360px;
      display: grid;
      grid-template-rows: auto minmax(126px, 1fr) auto auto;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: 18px;
      box-shadow: var(--shadow);
      scroll-margin-top: 18px;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    .card.is-selected {
      border-color: var(--coral);
      box-shadow: 0 22px 48px rgba(239, 111, 97, .23);
      transform: translateY(-2px);
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .label {
      color: var(--muted);
      font-size: 15px;
      font-weight: 900;
    }

    .badge {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #fff4d7;
      color: #8c6420;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .hanzi {
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      font-size: clamp(104px, 12vw, 154px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
    }

    .word {
      min-height: 58px;
      display: grid;
      place-items: center;
      border: 1px solid #bad7cf;
      border-radius: 8px;
      background: var(--green-soft);
      color: #216657;
      padding: 7px 12px;
      text-align: center;
      font-size: clamp(30px, 4vw, 42px);
      font-weight: 900;
      line-height: 1.15;
    }

    .sentence {
      min-height: 94px;
      display: flex;
      align-items: center;
      border-left: 7px solid var(--blue);
      border-radius: 8px;
      background: rgba(255, 255, 255, .76);
      padding: 12px 14px;
      font-size: clamp(22px, 2.7vw, 30px);
      font-weight: 850;
      line-height: 1.38;
    }

    .card:nth-child(3n + 1) .sentence {
      border-left-color: var(--coral);
    }

    .card:nth-child(3n + 2) .sentence {
      border-left-color: var(--green);
    }

    @media (max-width: 700px) {
      .page {
        width: min(100% - 18px, 560px);
        padding-top: 16px;
      }

      .top {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .tools {
        justify-content: flex-start;
        width: 100%;
      }

      .deck {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .card {
        min-height: 330px;
        padding: 16px;
      }

      .hanzi {
        font-size: clamp(118px, 36vw, 148px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>团团识字字卡</h1>
      <div class="tools">
        <span class="note">2026-06-06 添加</span>
        <button class="random-button" id="random-button" type="button">随机</button>
      </div>
    </header>

    <section class="deck" id="deck" aria-label="团团识字字卡"></section>
  </main>

  <script>
    const cards = [
      { char: "健", word: "健太", sentence: "红子像往常一样对健太说。", added: "2026-06-06" },
      { char: "营", word: "营业", sentence: "今天的营业到此结束。", added: "2026-06-06" },
      { char: "业", word: "营业", sentence: "今天的营业到此结束。", added: "2026-06-06" },
      { char: "厨", word: "厨房", sentence: "钱天堂的地下室不仅有厨房，还有一个浴池。", added: "2026-06-06" },
      { char: "房", word: "厨房", sentence: "钱天堂的地下室不仅有厨房，还有一个浴池。", added: "2026-06-06" },
      { char: "浴", word: "浴池", sentence: "钱天堂的地下室不仅有厨房，还有一个浴池。", added: "2026-06-06" },
      { char: "池", word: "浴池", sentence: "浴池和公共澡堂里的一样宽敞。", added: "2026-06-06" },
      { char: "宽", word: "宽敞", sentence: "浴池和公共澡堂里的一样宽敞。", added: "2026-06-06" },
      { char: "敞", word: "宽敞", sentence: "浴池和公共澡堂里的一样宽敞。", added: "2026-06-06" },
      { char: "依", word: "依然", sentence: "喝完牛奶后依然闷闷不乐。", added: "2026-06-06" },
      { char: "然", word: "依然", sentence: "喝完牛奶后依然闷闷不乐。", added: "2026-06-06" },
      { char: "墨", word: "墨丸", sentence: "墨丸比平时更加仔细地监视着健太。", added: "2026-06-06" },
      { char: "丸", word: "墨丸", sentence: "墨丸比平时更加仔细地监视着健太。", added: "2026-06-06" },
      { char: "联", word: "联系", sentence: "我和家人联系过没有吗？", added: "2026-06-06" },
      { char: "系", word: "联系", sentence: "我和家人联系过没有吗？", added: "2026-06-06" },
      { char: "影", word: "影响", sentence: "我不去学校有影响吗？", added: "2026-06-06" },
      { char: "响", word: "影响", sentence: "我不去学校有影响吗？", added: "2026-06-06" },
      { char: "漱", word: "漱口", sentence: "没有认真刷牙、洗手、漱口？", added: "2026-06-06" },
      { char: "口", word: "漱口", sentence: "没有认真刷牙、洗手、漱口？", added: "2026-06-06" },
      { char: "偷", word: "偷懒", sentence: "因为偷懒不刷牙而长蛀牙。", added: "2026-06-06" },
      { char: "懒", word: "偷懒", sentence: "因为偷懒不刷牙而长蛀牙。", added: "2026-06-06" },
      { char: "淡", word: "淡漠", sentence: "听完红子淡漠的回答，健太低下头。", added: "2026-06-06" },
      { char: "漠", word: "淡漠", sentence: "听完红子淡漠的回答，健太低下头。", added: "2026-06-06" },
      { char: "般", word: "哼哼般", sentence: "他发出蚊子哼哼般的声音。", added: "2026-06-06" },
      { char: "绝", word: "绝对", sentence: "绝对没有这样的事。", added: "2026-06-06" },
      { char: "对", word: "绝对", sentence: "绝对没有这样的事。", added: "2026-06-06" }
    ];

    const deck = document.querySelector("#deck");
    const randomButton = document.querySelector("#random-button");
    let selectedIndex = -1;

    function renderCards() {
      deck.innerHTML = cards.map((card, index) => `
        <article class="card" id="card-${index}" tabindex="-1" aria-label="${card.char} 字卡">
          <div class="meta">
            <span class="label">单字</span>
            <span class="badge">${card.added} 添加</span>
          </div>
          <div class="hanzi">${card.char}</div>
          <div class="word" aria-label="词">${card.word}</div>
          <p class="sentence">${card.sentence}</p>
        </article>
      `).join("");
    }

    function chooseRandomCard() {
      let nextIndex = Math.floor(Math.random() * cards.length);
      if (cards.length > 1 && nextIndex === selectedIndex) {
        nextIndex = (nextIndex + 1) % cards.length;
      }

      document.querySelectorAll(".card").forEach(card => {
        card.classList.remove("is-selected");
      });

      selectedIndex = nextIndex;
      const selectedCard = document.querySelector(`#card-${selectedIndex}`);
      selectedCard.classList.add("is-selected");
      selectedCard.scrollIntoView({ behavior: "smooth", block: "center" });
      selectedCard.focus({ preventScroll: true });
    }

    renderCards();
    randomButton.addEventListener("click", chooseRandomCard);
  </script>
</body>
</html>
