<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>团团识字字卡</title>
  <style>
    :root {
      --ink: #172326;
      --muted: #65777a;
      --line: #d8e4e1;
      --paper: #fffdf8;
      --green: #2f8f73;
      --green-soft: #e6f4ee;
      --coral: #ef6f61;
      --blue: #5398c3;
      --yellow: #f2bf48;
      --shadow: 0 20px 50px rgba(35, 52, 56, .14);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #f5faf8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, #f5faf8 0%, #fffdf8 52%, #eef7fb 100%);
    }

    button {
      font: inherit;
    }

    .page {
      width: min(100% - 28px, 1040px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(14px, 3vw, 28px) 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(12px, 2vw, 20px);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      min-width: 0;
      font-size: clamp(24px, 4.5vw, 44px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .progress {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #bad7cf;
      border-radius: 8px;
      background: var(--green-soft);
      color: #216657;
      padding: 0 12px;
      font-size: clamp(15px, 2vw, 18px);
      font-weight: 900;
      white-space: nowrap;
    }

    .stage {
      min-height: 0;
      display: grid;
      place-items: stretch center;
    }

    .card {
      width: min(100%, 860px);
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(150px, 1fr) auto auto;
      gap: clamp(14px, 2.5vw, 24px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: clamp(18px, 4vw, 38px);
      box-shadow: var(--shadow);
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .label {
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 900;
    }

    .badge {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #fff4d7;
      color: #8c6420;
      padding: 6px 12px;
      font-size: clamp(13px, 1.8vw, 16px);
      font-weight: 900;
      white-space: nowrap;
    }

    .hanzi {
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      font-size: clamp(168px, 30vw, 330px);
      font-weight: 700;
      line-height: .9;
      letter-spacing: 0;
    }

    .word {
      min-height: clamp(64px, 9vw, 92px);
      display: grid;
      place-items: center;
      border: 1px solid #bad7cf;
      border-radius: 8px;
      background: var(--green-soft);
      color: #216657;
      padding: 8px 16px;
      text-align: center;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 900;
      line-height: 1.12;
    }

    .sentence {
      min-height: clamp(104px, 15vw, 142px);
      display: flex;
      align-items: center;
      border-left: 8px solid var(--blue);
      border-radius: 8px;
      background: rgba(255, 255, 255, .78);
      padding: clamp(13px, 2.5vw, 22px);
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 850;
      line-height: 1.38;
    }

    .controls {
      display: grid;
      grid-template-columns: 58px minmax(116px, 180px) 58px;
      justify-content: center;
      gap: 10px;
    }

    .nav-button,
    .random-button {
      min-height: 52px;
      border: 1px solid #bad7cf;
      border-radius: 8px;
      background: white;
      color: #216657;
      cursor: pointer;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(35, 52, 56, .09);
    }

    .random-button {
      border-color: #dca094;
      background: var(--coral);
      color: white;
      font-size: 20px;
      box-shadow: 0 8px 20px rgba(239, 111, 97, .22);
    }

    .nav-button:focus-visible,
    .random-button:focus-visible {
      outline: 4px solid rgba(83, 152, 195, .32);
      outline-offset: 3px;
    }

    @media (min-width: 760px) and (max-height: 860px) {
      .card {
        min-height: 0;
        grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
        align-items: stretch;
        gap: 16px;
        padding: clamp(18px, 3vw, 30px);
      }

      .meta {
        grid-column: 1 / -1;
      }

      .hanzi {
        grid-row: 2 / 4;
        font-size: clamp(180px, 24vw, 280px);
      }

      .word,
      .sentence {
        align-self: center;
      }
    }

    @media (max-width: 700px) {
      .page {
        width: min(100% - 18px, 560px);
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .top {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .card {
        width: 100%;
        height: 100%;
        min-height: 0;
        padding: 16px;
      }

      .hanzi {
        font-size: clamp(156px, 50vw, 236px);
      }

      .controls {
        grid-template-columns: 54px minmax(104px, 1fr) 54px;
      }
    }

    @media (max-width: 390px) {
      .card {
        min-height: 0;
        gap: 12px;
      }

      .badge {
        padding-inline: 9px;
      }

      .sentence {
        font-size: clamp(22px, 6vw, 27px);
      }
    }

    @media (max-height: 760px) {
      .page {
        padding-top: 12px;
        padding-bottom: 12px;
        gap: 10px;
      }

      h1 {
        font-size: clamp(24px, 4vw, 36px);
      }

      .progress {
        min-height: 30px;
      }

      .card {
        min-height: 0;
        height: 100%;
        padding: clamp(14px, 3vw, 24px);
        gap: 12px;
      }

      .hanzi {
        font-size: clamp(132px, 23vw, 250px);
      }

      .word {
        min-height: 54px;
        font-size: clamp(28px, 4.5vw, 42px);
      }

      .sentence {
        min-height: 72px;
        font-size: clamp(20px, 3.2vw, 30px);
      }

      .nav-button,
      .random-button {
        min-height: 46px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>团团识字字卡</h1>
      <div class="progress" id="progress">1 / 26</div>
    </header>

    <section class="stage" aria-live="polite">
      <article class="card" id="card" aria-label="团团识字字卡">
        <div class="meta">
          <span class="label">单字</span>
          <span class="badge" id="added-badge">2026-06-06 添加</span>
        </div>
        <div class="hanzi" id="card-char">健</div>
        <div class="word" id="card-word" aria-label="词">健太</div>
        <p class="sentence" id="card-sentence">红子像往常一样对健太说。</p>
      </article>
    </section>

    <nav class="controls" aria-label="字卡切换">
      <button class="nav-button" id="prev-button" type="button" aria-label="上一张">‹</button>
      <button class="random-button" id="random-button" type="button">随机</button>
      <button class="nav-button" id="next-button" type="button" aria-label="下一张">›</button>
    </nav>
  </main>

  <script>
    const cards = [
      { char: "健", word: "健太", sentence: "红子像往常一样对健太说。", added: "2026-06-06" },
      { char: "营", word: "营业", sentence: "今天的营业到此结束。", added: "2026-06-06" },
      { char: "业", word: "营业", sentence: "今天的营业到此结束。", added: "2026-06-06" },
      { char: "厨", word: "厨房", sentence: "钱天堂的地下室不仅有厨房，还有一个浴池。", added: "2026-06-06" },
      { char: "房", word: "厨房", sentence: "钱天堂的地下室不仅有厨房，还有一个浴池。", added: "2026-06-06" },
      { char: "浴", word: "浴池", sentence: "钱天堂的地下室不仅有厨房，还有一个浴池。", added: "2026-06-06" },
      { char: "池", word: "浴池", sentence: "浴池和公共澡堂里的一样宽敞。", added: "2026-06-06" },
      { char: "宽", word: "宽敞", sentence: "浴池和公共澡堂里的一样宽敞。", added: "2026-06-06" },
      { char: "敞", word: "宽敞", sentence: "浴池和公共澡堂里的一样宽敞。", added: "2026-06-06" },
      { char: "依", word: "依然", sentence: "喝完牛奶后依然闷闷不乐。", added: "2026-06-06" },
      { char: "然", word: "依然", sentence: "喝完牛奶后依然闷闷不乐。", added: "2026-06-06" },
      { char: "墨", word: "墨丸", sentence: "墨丸比平时更加仔细地监视着健太。", added: "2026-06-06" },
      { char: "丸", word: "墨丸", sentence: "墨丸比平时更加仔细地监视着健太。", added: "2026-06-06" },
      { char: "联", word: "联系", sentence: "我和家人联系过没有吗？", added: "2026-06-06" },
      { char: "系", word: "联系", sentence: "我和家人联系过没有吗？", added: "2026-06-06" },
      { char: "影", word: "影响", sentence: "我不去学校有影响吗？", added: "2026-06-06" },
      { char: "响", word: "影响", sentence: "我不去学校有影响吗？", added: "2026-06-06" },
      { char: "漱", word: "漱口", sentence: "没有认真刷牙、洗手、漱口？", added: "2026-06-06" },
      { char: "口", word: "漱口", sentence: "没有认真刷牙、洗手、漱口？", added: "2026-06-06" },
      { char: "偷", word: "偷懒", sentence: "因为偷懒不刷牙而长蛀牙。", added: "2026-06-06" },
      { char: "懒", word: "偷懒", sentence: "因为偷懒不刷牙而长蛀牙。", added: "2026-06-06" },
      { char: "淡", word: "淡漠", sentence: "听完红子淡漠的回答，健太低下头。", added: "2026-06-06" },
      { char: "漠", word: "淡漠", sentence: "听完红子淡漠的回答，健太低下头。", added: "2026-06-06" },
      { char: "般", word: "哼哼般", sentence: "他发出蚊子哼哼般的声音。", added: "2026-06-06" },
      { char: "绝", word: "绝对", sentence: "绝对没有这样的事。", added: "2026-06-06" },
      { char: "对", word: "绝对", sentence: "绝对没有这样的事。", added: "2026-06-06" }
    ];

    const progress = document.querySelector("#progress");
    const addedBadge = document.querySelector("#added-badge");
    const cardChar = document.querySelector("#card-char");
    const cardWord = document.querySelector("#card-word");
    const cardSentence = document.querySelector("#card-sentence");
    const prevButton = document.querySelector("#prev-button");
    const randomButton = document.querySelector("#random-button");
    const nextButton = document.querySelector("#next-button");
    let selectedIndex = 0;

    function showCard(index) {
      selectedIndex = (index + cards.length) % cards.length;
      const card = cards[selectedIndex];
      progress.textContent = `${selectedIndex + 1} / ${cards.length}`;
      addedBadge.textContent = `${card.added} 添加`;
      cardChar.textContent = card.char;
      cardWord.textContent = card.word;
      cardSentence.textContent = card.sentence;
    }

    function showRandomCard() {
      let nextIndex = Math.floor(Math.random() * cards.length);
      if (cards.length > 1 && nextIndex === selectedIndex) {
        nextIndex = (nextIndex + 1) % cards.length;
      }
      showCard(nextIndex);
    }

    prevButton.addEventListener("click", () => showCard(selectedIndex - 1));
    randomButton.addEventListener("click", showRandomCard);
    nextButton.addEventListener("click", () => showCard(selectedIndex + 1));

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") {
        showCard(selectedIndex - 1);
      }
      if (event.key === "ArrowRight") {
        showCard(selectedIndex + 1);
      }
    });

    showCard(0);
  </script>
</body>
</html>
