<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圆圆识字 - 极简字卡</title>
  <style>
    :root {
      --ink: #172326;
      --muted: #65777a;
      --line: #d8e4e1;
      --paper: #fffdf8;
      --green: #2f8f73;
      --green-soft: #e6f4ee;
      --coral: #ef6f61;
      --blue: #5398c3;
      --yellow: #f2bf48;
      --shadow: 0 22px 50px rgba(35, 52, 56, .13);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #f5faf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #f5faf8 0%, #fffdf8 48%, #eef7fb 100%);
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1080px, calc(100% - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 0 34px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 100%;
      min-width: 0;
    }

    .search-wrap {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      padding: 0 2px;
      color: var(--muted);
    }

    .search-input {
      width: 96px;
      min-height: 32px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
    }

    .result-count {
      color: var(--muted);
      font-size: 14px;
      min-width: 52px;
    }

    .tab-group {
      display: inline-flex;
      flex: 1 1 280px;
      gap: 4px;
      max-width: min(100%, 560px);
      min-width: 0;
      overflow-x: auto;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 8px 22px rgba(35, 52, 56, .08);
    }

    .tab {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
      font-size: 23px;
      line-height: 1;
    }

    .tab[aria-pressed="true"] {
      background: var(--green);
      color: white;
    }

    .print-button {
      min-height: 44px;
      border: 1px solid #bad7cf;
      border-radius: 8px;
      background: white;
      color: #235f50;
      padding: 0 14px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(35, 52, 56, .08);
    }

    .stage {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(360px, .95fr) minmax(260px, .55fr);
      gap: 18px;
      align-items: stretch;
    }

    .card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .hero-card {
      min-height: min(720px, calc(100vh - 118px));
      padding: clamp(22px, 4vw, 46px);
      display: grid;
      grid-template-rows: 1fr auto auto;
      gap: clamp(16px, 3vw, 26px);
    }

    .hero-main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(170px, .42fr);
      gap: clamp(16px, 3vw, 30px);
      align-items: center;
    }

    .hanzi {
      justify-self: center;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      font-size: clamp(190px, 28vw, 350px);
      font-weight: 700;
      line-height: .9;
      letter-spacing: 0;
      color: #142226;
    }

    .art {
      width: min(100%, 240px);
      aspect-ratio: 1;
      justify-self: center;
      position: relative;
    }

    .art svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .words {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .word {
      min-height: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--green-soft);
      color: #216657;
      padding: 0 24px;
      font-size: clamp(34px, 3.8vw, 52px);
      font-weight: 800;
      line-height: 1.1;
    }

    .sentence {
      margin: 0;
      text-align: center;
      color: var(--coral);
      font-size: clamp(38px, 4.2vw, 56px);
      font-weight: 800;
      line-height: 1.35;
    }

    .print-sheet {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      min-width: 0;
    }

    .mini-card {
      min-height: 0;
      padding: 16px;
      display: grid;
      grid-template-columns: 96px 1fr 82px;
      gap: 12px;
      align-items: center;
      box-shadow: none;
      cursor: pointer;
    }

    .mini-card[aria-current="true"] {
      border-color: #8bc7b2;
      background: #f8fffb;
    }

    .mini-card .hanzi {
      font-size: 86px;
    }

    .mini-card .art {
      width: 76px;
    }

    .mini-text {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    .mini-words {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mini-words span {
      color: #216657;
      background: var(--green-soft);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .mini-sentence {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .empty-state {
      min-height: 280px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      font-size: 26px;
      font-weight: 800;
    }

    .print-grid {
      display: none;
    }

    .print-card {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      gap: 7mm;
      padding: 9mm;
      border: .35mm solid #cbd9d6;
      border-radius: 2mm;
      background: var(--paper);
      overflow: hidden;
      break-inside: avoid;
    }

    .print-card-main {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 35mm;
      gap: 6mm;
      align-items: center;
    }

    .print-card .hanzi {
      font-size: 58mm;
      justify-self: center;
    }

    .print-card .art {
      width: 33mm;
    }

    .print-card .words {
      gap: 3mm;
    }

    .print-card .word {
      min-height: 12mm;
      padding: 0 6mm;
      font-size: 9mm;
    }

    .print-card .sentence {
      font-size: 9mm;
      line-height: 1.25;
    }

    @media (max-width: 880px) {
      .page {
        width: min(100% - 20px, 640px);
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        justify-content: flex-start;
        width: 100%;
      }

      .tab-group {
        max-width: 100%;
      }

      .stage {
        grid-template-columns: 1fr;
      }

      .hero-card {
        min-height: calc(100vh - 160px);
      }

      .hero-main {
        grid-template-columns: 1fr;
        align-content: center;
      }

      .hanzi {
        font-size: clamp(190px, 54vw, 310px);
      }

      .art {
        width: min(45vw, 190px);
      }

      .print-sheet {
        grid-template-columns: 1fr 1fr;
      }

      .mini-card {
        grid-template-columns: 76px 1fr;
      }

      .mini-card .art {
        display: none;
      }

      .mini-card .hanzi {
        font-size: 70px;
      }
    }

    @media (max-width: 540px) {
      .page {
        padding-top: 14px;
      }

      .brand {
        font-size: 20px;
      }

      .tab {
        width: 28px;
        height: 30px;
        font-size: 20px;
      }

      .search-wrap {
        width: auto;
      }

      .search-input {
        width: 86px;
      }

      .hero-card {
        min-height: calc(100vh - 150px);
        padding: 18px;
      }

      .hanzi {
        font-size: clamp(170px, 60vw, 260px);
      }

      .word {
        min-height: 46px;
        padding: 0 17px;
        font-size: 32px;
      }

      .sentence {
        font-size: 36px;
      }

      .print-sheet {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }

      body {
        background: white;
      }

      .page {
        width: auto;
        min-height: auto;
        padding: 0;
        display: block;
      }

      .toolbar,
      .stage {
        display: none;
      }

      .print-grid {
        display: grid;
        width: 194mm;
        min-height: 281mm;
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 136mm;
        gap: 6mm;
      }

      .print-card {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="toolbar">

        </label>
        <div class="result-count" id="result-count"></div>
        <div class="tab-group" aria-label="选择字卡"></div>
        <button class="print-button" type="button" onclick="window.print()">打印</button>

    <section class="stage" aria-label="字卡预览">
      <article class="card hero-card" id="hero-card"></article>
      <div class="print-sheet" id="mini-list" aria-label="字卡列表"></div>
    </section>

    <section class="print-grid" id="print-grid" aria-label="打印字卡"></section>
  </main>

    const hero = document.querySelector("#hero-card");
    const tabs = document.querySelector(".tab-group");
    const miniList = document.querySelector("#mini-list");
    const printGrid = document.querySelector("#print-grid");
    const searchInput = document.querySelector("#search-input");
    const resultCount = document.querySelector("#result-count");
    const state = { selected: 0, query: "" };

    function numberArt(count) {
      const positions = [
        [60, 28], [43, 46], [77, 46], [34, 66], [60, 66],
        [86, 66], [35, 88], [52, 93], [70, 93], [88, 88]
      ];
      const dots = positions.slice(0, count).map(([cx, cy], index) => {
        const fill = index % 3 === 0 ? "var(--green)" : index % 3 === 1 ? "var(--yellow)" : "var(--coral)";
        return `<circle cx="${cx}" cy="${cy}" r="8" fill="${fill}"/>`;
      }).join("");
      return `
        <svg viewBox="0 0 120 120" role="img" aria-label="${count}个">
          ${dots}
          <path d="M28 104 H92" stroke="var(--blue)" stroke-width="8" stroke-linecap="round"/>
        </svg>`;
    }

    function artHtml(card) {
      if (card.art === "number") return numberArt(card.count || 1);
      return artMap[card.art] || `
        <svg viewBox="0 0 120 120" role="img" aria-label="字义">
          <circle cx="60" cy="55" r="28" fill="none" stroke="var(--green)" stroke-width="8"/>
          <path d="M30 92 H90" stroke="var(--blue)" stroke-width="8" stroke-linecap="round"/>
        </svg>`;
    }

    function cardHtml(card, className = "") {
      return `
        <div class="${className ? className + "-main" : "hero-main"}">
          <div class="hanzi">${card.char}</div>
          <div class="art">${artHtml(card)}</div>
        </div>
        <div class="words">
          ${card.words.map((word) => `<span class="word">${word}</span>`).join("")}
        </div>
        <p class="sentence">${card.sentence}</p>
      `;
    }

    function miniHtml(card, index, current) {
      return `
        <article class="card mini-card" role="button" tabindex="0" data-index="${index}" aria-current="${current}">
          <div class="hanzi">${card.char}</div>
          <div class="mini-text">
            <div class="mini-words">${card.words.map((word) => `<span>${word}</span>`).join("")}</div>
            <div class="mini-sentence">${card.sentence}</div>
          </div>
          <div class="art">${artHtml(card)}</div>
        </article>
      `;
    }

    function visibleIndexes() {
      const query = state.query.trim();
      if (!query) return cards.map((_, index) => index);
      return cards
        .map((card, index) => ({ card, index }))
        .map(({ card, index }) => {
          const haystack = [card.char, ...card.words, card.sentence].join("");
          let score = 99;
          if (card.char === query) score = 0;
          else if (card.words.includes(query)) score = 1;
          else if (card.words.some((word) => word.includes(query))) score = 2;
          else if (card.sentence.includes(query)) score = 3;
          else if (haystack.includes(query)) score = 4;
          return { index, score };
        })
        .filter(({ score }) => score < 99)
        .sort((a, b) => a.score - b.score || a.index - b.index)
        .map(({ index }) => index);
    }

    function render(index = state.selected) {
      const visible = visibleIndexes();
      resultCount.textContent = `${visible.length} 张`;

      if (!visible.length) {
        hero.innerHTML = `<div class="empty-state">没有找到这个字</div>`;
        tabs.innerHTML = "";
        miniList.innerHTML = "";
        printGrid.innerHTML = "";
        return;
      }

      if (!visible.includes(index)) index = visible[0];
      state.selected = index;
      const card = cards[index];
      hero.innerHTML = cardHtml(card);
      tabs.innerHTML = visible.map((itemIndex) => `
        <button class="tab" type="button" aria-pressed="${itemIndex === index}" data-index="${itemIndex}">${cards[itemIndex].char}</button>
      `).join("");
      tabs.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => render(Number(tab.dataset.index)));
      });
      miniList.innerHTML = visible.map((itemIndex) => miniHtml(cards[itemIndex], itemIndex, itemIndex === index)).join("");
      miniList.querySelectorAll(".mini-card").forEach((node) => {
        const nextIndex = Number(node.dataset.index);
        node.addEventListener("click", () => render(nextIndex));
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") render(nextIndex);
        });
      });
      printGrid.innerHTML = visible.map((itemIndex) => `
        <article class="print-card">${cardHtml(cards[itemIndex], "print-card")}</article>
      `).join("");
    }

    searchInput.addEventListener("input", () => {
      state.query = searchInput.value;
      render(state.selected);
    });

    render(0);
  </script>
